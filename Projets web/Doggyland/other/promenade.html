<html lang="fr">

    <title>Doggyland</title>
    <link rel="stylesheet" href="../css/promenade.css">
    <link type = "image/x-icon" rel = "shortcut icon" href ="../icone/patte-de-chien.png"/>
</head>
<body>
    <section>
            <nav class="nav">
                <figure>
                    <a href = "../index.html" class="acc"><img src="../icone/labrador.png"></a>
                    <figcaption>
                        Accueil
                    </figcaption>  
                </figure>
                <figure>
                    <a  href = "../other/petshop.html" class="acc"><img src="../icone/togetherness.png"></a>
                    <figcaption>
                        Pet Shop
                    </figcaption>  
                </figure>
                <figure>
                    <a href = "#" class="acc"><img src="../icone/chien.png"></a>
                    <figcaption>
                        Promenade
                    </figcaption>  
                </figure>
                <figure>
                    <a href="../other/toilettage.html" class="acc"><img src="../icone/toilettage.png"></a>
                    <figcaption>
                        Toilettage
                    </figcaption>  
                </figure>
            </nav>
    </section>
    <div>
        <h1 class="title"><span>"Allons~</span><span>nous~</span><span>balader"</span></h1>
        <h2 class="tt">Notre equipe vous permet d'économiser votre temps en promenant pour vous votre petit toutou ▾</h2>
    </div>  
    <section>
        <fieldset class="log">
            <legend>
                <p style="font-size: xx-large;" class="titre">Réservez une promenade</p>
            </legend>
            <table>
                <div class="ilo">
                    <img src="../icone/chien-devant-un-homme.png">
                    <p>Veuillez compléter les informations suivantes :</p>
                </div>
                <tr>
                    <td>Nom du chien</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Race</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Date pour la promenade</td>
                    <td><input type="date"></td>
                </tr>
                <tr>
                    <td>Heure pour la promenade</td>
                    <td><input type="time"></td>
                </tr>
                <tr>
                    <td>Type</td>
                    <td>
                        <select name="Type">
                            <option value="">Promenade courte (5~10mn)</option>
                            <option value="">Promenade longue (15~30mn)</option>
                            <option value="">Jogging (1~3km)</option>
                        </select>
                    </td>   
                </tr>
                <tr>
                    <td>Votre Nom</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Votre adresse</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Votre contact</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>
                        <br>
                    </td>
                </tr>
                <tr>
                    <th class="bt"><input type="submit" value="Réservez" style="font-family: nav; font-weight: bold; " ></th>
                </tr>
            </table>
        </fieldset>
    </section>
</section>
<script src="../javascript/proscript.js"></script>
</body>
